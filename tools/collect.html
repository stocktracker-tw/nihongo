<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>Nihongo — 語音文字清單</title>
<style>body{font-family:system-ui,sans-serif;margin:24px;background:#1b1916;color:#ece6da}textarea{width:100%;height:60vh;background:#2a2622;color:inherit;border:1px solid #444;border-radius:12px;padding:12px}button{padding:8px 16px;border-radius:999px;border:0;background:#7f0019;color:#fff;font-weight:600;cursor:pointer}</style>
</head>
<body>
  <h1>語音文字清單</h1>
  <p>改了課程或單字後：下載 <code>texts.json</code> 和 <code>hints.json</code> 放到 <code>tools/</code>，再執行 <code>python tools/gen_audio.py</code>。</p>
  <p><button id="dl">下載 texts.json</button> <button id="dlh">下載 hints.json</button> <span id="n"></span></p>
  <textarea id="out" readonly></textarea>
  <script src="../js/data.js"></script>
  <script src="../js/course.js"></script>
  <script src="collect.js"></script>
  <script>
    const texts = collectSpeechTexts();
    const json = JSON.stringify(texts, null, 1);
    document.getElementById('out').value = json;
    document.getElementById('n').textContent = texts.length + ' 段文字';
    const save = (name, data) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      a.download = name; a.click();
    };
    document.getElementById('dl').onclick = () => save('texts.json', json);
    document.getElementById('dlh').onclick = () => save('hints.json', JSON.stringify(collectSpeechHints(), null, 1));
  </script>
</body>
</html>
