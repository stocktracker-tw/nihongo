<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nihongo — 聲音候選</title>
<style>
  body { margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif; color: #ece6da;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(168,134,90,.18), transparent 60%), #1b1916; min-height: 100vh; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: #a39b8e; margin: 0 0 20px; }
  .text { font-family: "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 18px; padding: 12px 16px; border-radius: 16px;
    background: rgba(255,244,226,.05); border: 1px solid rgba(236,226,208,.1); margin-bottom: 18px; }
  .v { display: grid; grid-template-columns: 52px 1fr; gap: 4px 14px; align-items: center; padding: 14px 16px; margin-bottom: 10px;
    border-radius: 20px; background: linear-gradient(180deg, rgba(58,53,47,.82), rgba(40,37,33,.86)); border: 1px solid rgba(236,226,208,.1);
    box-shadow: 0 8px 22px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,244,226,.1); }
  .v.cur { border-color: #d6b483; }
  .play { grid-row: span 2; width: 52px; height: 52px; border-radius: 50%; border: 0; font-size: 20px; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, #9b2338, #7f0019); box-shadow: 0 6px 16px rgba(127,0,25,.3), inset 0 1px 0 rgba(255,255,255,.4); }
  .name { font-weight: 700; } .name small { font-weight: 500; color: #d6b483; margin-left: 6px; }
  .desc { color: #a39b8e; font-size: 14px; }
  code { font-size: 12px; color: #a39b8e; }
</style>
</head>
<body>
<main>
  <h1>聲音候選</h1>
  <p class="sub">10 個 Azure 日文語音，念同一段文字。選好告訴我名字，就用它重新產生全部發音。</p>
  <div class="text" id="text"></div>
  <div id="list"></div>
</main>
<script>
  fetch('voice-samples/voices.json').then(r => r.json()).then(d => {
    document.getElementById('text').textContent = d.text;
    let cur = null;
    document.getElementById('list').innerHTML = d.voices.map((v, i) => `
      <div class="v" data-i="${i}">
        <button class="play" data-f="voice-samples/${v.file}" aria-label="播放">▶</button>
        <div class="name">${i + 1}. ${v.name.replace('ja-JP-', '').replace('Neural', '')}<small>${v.gender}</small></div>
        <div class="desc">${v.desc}　<code>${v.name}</code></div>
      </div>`).join('');
    document.querySelectorAll('.play').forEach(b => b.onclick = () => {
      if (cur) cur.pause();
      document.querySelectorAll('.v').forEach(x => x.classList.remove('cur'));
      b.parentElement.classList.add('cur');
      cur = new Audio(b.dataset.f); cur.play();
    });
  });
</script>
</body>
</html>
